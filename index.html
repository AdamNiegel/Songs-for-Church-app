<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Church Chords</title>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--mut:#6b6b70;--card:#f2f2f6;--acc:#2563eb;--ch:#c2410c;--bd:#d8d8de}
@media(prefers-color-scheme:dark){:root{--bg:#121214;--fg:#ececf0;--mut:#9a9aa3;--card:#1e1e22;--acc:#5b8def;--ch:#fb923c;--bd:#34343a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,Roboto,sans-serif}
body{padding-top:env(safe-area-inset-top,0);padding-bottom:calc(env(safe-area-inset-bottom,0) + 8px)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);display:flex;gap:6px;align-items:center;padding:8px 10px;flex-wrap:wrap}
h1{font-size:18px;margin:0;flex:1;min-width:120px}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;min-height:40px}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
button.on{background:var(--acc);color:#fff}
button.d{color:#dc2626}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;min-height:40px;width:100%}
.wrap{padding:10px 12px 160px}
.item{display:flex;justify-content:space-between;padding:13px 4px;border-bottom:1px solid var(--bd)}
.item small{color:var(--mut)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
.tabs button{flex:1}
.ln{display:flex;flex-wrap:wrap;align-items:flex-end;margin:2px 0;line-height:1.25}
.seg{display:inline-flex;flex-direction:column}
.ch{color:var(--ch);font-weight:700;font-size:.9em;min-height:1.25em;padding-right:6px;white-space:pre}
.ly{white-space:pre-wrap}
.sec{font-weight:700;margin-top:14px;color:var(--acc)}
.cm{font-style:italic;color:var(--mut)}
.gap{height:10px}
.edit i{font-style:normal;padding:4px 0;cursor:pointer}
.edit i:active,.edit b:active{background:var(--acc);color:#fff}
.edit .ch{cursor:pointer}
.edit .sel{background:#fde68a;color:#000}
.tools{display:flex;gap:2px;margin-right:6px}
.tools button{padding:0 6px;min-height:30px;font-size:13px}
.dg{display:flex;gap:10px;overflow-x:auto;padding:6px 2px}
.dg.grid{flex-wrap:wrap;overflow:visible}
.dc{background:var(--card);border-radius:10px;padding:6px;text-align:center;flex:0 0 auto}
.dc b{display:block;color:var(--ch)}
.dc svg{display:block;margin:auto}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--bd);padding:8px 10px calc(env(safe-area-inset-bottom,0) + 8px);z-index:6}
.dots{display:flex;gap:6px;justify-content:center;margin-top:6px}
.dots span{width:14px;height:14px;border-radius:50%;background:var(--bd)}
.dots span.hit{background:var(--acc)}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--acc);padding:10px;z-index:9;max-height:62vh;overflow:auto}
.g{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:6px 0}
.g button{padding:6px 0;min-height:38px}
.big{font-size:22px;font-weight:700;color:var(--ch)}
.modal{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:center;justify-content:center}
.modal>div{background:var(--bg);padding:16px;border-radius:14px;text-align:center;max-width:90%}
</style></head>
<body><div id="app"></div><script src="music.js"></script><script src="app.js"></script></body></html>
